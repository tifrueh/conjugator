on:
  push:
    tags:
      - v1.*

jobs:
  build_macos:
    name: Build for macOS
    runs-on: macos-latest
    env:
      WX_VERSION: "3.3.4"
      WX_PREFIX: ${{ github.workspace }}/../wx
    steps:
      - name: Checkout the repository
        uses: actions/checkout@v7
      - name: Setup wxWidgets cache
        id: cache-wx
        uses: actions/cache@v6
        with:
          path: ${{ env.WX_PREFIX }}
          key: wx-${{ env.WX_VERSION }}-${{ runner.os }}-${{ runner.arch }}
      - name: Build wxWidgets
        if: steps.cache-wx.outputs.cache-hit != 'true'
        run: |
          PATH="/usr/bin:/bin:/usr/sbin:/sbin"
          mkdir ../wx-build
          cd ../wx-build
          curl -fsSL "https://github.com/wxWidgets/wxWidgets/releases/download/v${{ env.WX_VERSION }}/wxWidgets-${{ env.WX_VERSION }}.tar.bz2" | tar xj
          cd "wxWidgets-${WX_VERSION}"
          ./configure \
            --prefix "${WX_PREFIX}" \
            --disable-shared
          make install
      - name: Install meson
        run: brew install meson
      - name: Build bundle
        run: |
          PATH="${WX_PREFIX}/bin:${PATH}"
          meson setup --buildtype release -D static_wxwidgets=enabled -D prefer_static=true build
          meson compile -C build bundle_mac
      - name: Upload bundle
        uses: actions/upload-artifact@v7
        with:
          name: Conjugateur-${{ github.ref_name }}-macOS-arm64.app
          path: build/Conjugateur.app

  build_macos_intel:
    name: Build for macOS (Intel)
    runs-on: macos-26-intel
    env:
      WX_VERSION: "3.3.4"
      WX_PREFIX: ${{ github.workspace }}/../wx
    steps:
      - name: Checkout the repository
        uses: actions/checkout@v7
      - name: Setup wxWidgets cache
        id: cache-wx
        uses: actions/cache@v6
        with:
          path: ${{ env.WX_PREFIX }}
          key: wx-${{ env.WX_VERSION }}-${{ runner.os }}-${{ runner.arch }}
      - name: Build wxWidgets
        if: steps.cache-wx.outputs.cache-hit != 'true'
        run: |
          PATH="/usr/bin:/bin:/usr/sbin:/sbin"
          mkdir ../wx-build
          cd ../wx-build
          curl -fsSL "https://github.com/wxWidgets/wxWidgets/releases/download/v${{ env.WX_VERSION }}/wxWidgets-${{ env.WX_VERSION }}.tar.bz2" | tar xj
          cd "wxWidgets-${WX_VERSION}"
          ./configure \
            --prefix "${WX_PREFIX}" \
            --disable-shared
          make install
      - name: Install meson
        run: brew install meson
      - name: Build bundle
        run: |
          PATH="${WX_PREFIX}/bin:${PATH}"
          meson setup --buildtype release -D static_wxwidgets=enabled -D prefer_static=true build
          meson compile -C build bundle_mac
      - name: Upload bundle
        uses: actions/upload-artifact@v7
        with:
          name: Conjugateur-${{ github.ref_name }}-macOS-x86_64.app
          path: build/Conjugateur.app

  build_windows:
    name: Build for Windows
    runs-on: windows-latest
    steps:
      - name: Checkout the repository
        uses: actions/checkout@v7
      - name: Set up MSYS2 with all dependencies
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          path-type: inherit
          install: >-
            mingw-w64-ucrt-x86_64-toolchain
            mingw-w64-ucrt-x86_64-git
            mingw-w64-ucrt-x86_64-meson
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-wxwidgets3.3-msw
      - name: Build bundle
        shell: msys2 {0}
        run: |
          meson setup --buildtype release -D cpp_args=-static -D cpp_link_args=-static -D static_wxwidgets=enabled -D prefer_static=true build
          meson compile -C build bundle_win
      - name: Upload bundle
        uses: actions/upload-artifact@v7
        with:
          name: Conjugateur-${{ github.ref_name }}-setup-w64-x86_64.exe
          path: build/Conjugateur-setup.exe
